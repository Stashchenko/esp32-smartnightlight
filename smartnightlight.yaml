esphome:
  name: smartnightlight
  name_add_mac_suffix: false
  friendly_name: SmartNightLight

esp32:
  board: esp32-s3-devkitc-1
  cpu_frequency: 240MHz
  variant: esp32s3
  flash_size: 16MB
  framework:
    type: esp-idf
    version: recommended
    advanced:
      flash_chip: boya
    sdkconfig_options:
      CONFIG_ESP32S3_DATA_CACHE_64KB: "y"
      CONFIG_ESP32S3_DATA_CACHE_LINE_64B: "y"
      CONFIG_ESP32S3_INSTRUCTION_CACHE_32KB: "y"

      CONFIG_SPIRAM_RODATA: "y"
      CONFIG_SPIRAM_FETCH_INSTRUCTIONS: "y"

      CONFIG_BT_ALLOCATION_FROM_SPIRAM_FIRST: "y"
      CONFIG_BT_BLE_DYNAMIC_ENV_MEMORY: "y"

      CONFIG_MBEDTLS_EXTERNAL_MEM_ALLOC: "y"
      CONFIG_MBEDTLS_SSL_PROTO_TLS1_3: "y"  # TLS1.3 support isn't enabled by default in IDF 5.1.5

      # enable psram
      CONFIG_SPIRAM_MODE_OCT: "y"
      CONFIG_SPIRAM: "y"
      CONFIG_ESPTOOLPY_FLASHMODE_QIO: "y"
      CONFIG_ESPTOOLPY_FLASHFREQ_80M: "y"
      CONFIG_ESP_DEFAULT_CPU_FREQ_MHZ_240: "y"

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: NONE

  ap:
    ssid: "SmartNightLightAP"
    password: "fallbackpassword"


api:
  encryption:
    key: "CGIvMEs7B4mqFt7/+mL/Xxa/bD7jzkNu7N5Cpi2L/FU="

ota:
  - platform: esphome
    encryption:

captive_portal:

logger:
  level: INFO

output:
  - platform: ledc
    pin: GPIO4
    id: output_red
    frequency: 5000Hz

  - platform: ledc
    pin: GPIO5
    id: output_green
    frequency: 5000Hz

  - platform: ledc
    pin: GPIO6
    id: output_blue
    frequency: 5000Hz

  - platform: ledc
    pin: GPIO7
    id: output_white
    frequency: 5000Hz

light:
  - platform: rgbw
    name: "Night Light"
    id: night_light
    red: output_red
    green: output_green
    blue: output_blue
    white: output_white
    default_transition_length: 1s
    restore_mode: RESTORE_DEFAULT_OFF

sensor:
  - platform: wifi_signal
    name: "WiFi Signal"
    update_interval: 60s
    id: wifi_signal_db
    entity_category: "diagnostic"
    internal: true
  - platform: copy
    source_id: wifi_signal_db
    name: "WiFi Signal Percent"
    icon: mdi:wifi
    filters:
      - lambda: return min(max(2 * (x + 100.0), 0.0), 100.0);
    unit_of_measurement: " %"
    entity_category: "diagnostic"
    device_class: ""


i2s_audio:
  - id: i2s_output
    i2s_lrclk_pin: GPIO16
    i2s_bclk_pin: GPIO15

speaker:
  - platform: i2s_audio
    id: speaker_id
    i2s_audio_id: i2s_output
    i2s_dout_pin: GPIO17
    dac_type: external
    channel: mono
    sample_rate: 48000
    bits_per_sample: 16bit
    buffer_duration: 500ms

sendspin:
  id: sendspin_hub
  task_stack_in_psram: false

media_source:
  - platform: sendspin
    id: sendspin_source

media_player:
  - platform: speaker_source
    id: sendspin_player
    name: "Player"
    media_pipeline:
      speaker: speaker_id
      sources:
        - sendspin_source
